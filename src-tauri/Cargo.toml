[package]
name = "brewi"
version = "0.1.0"
description = "Modern macOS Homebrew Manager in Rust"
authors = ["Muhammad Umer Farooq"]
edition = "2021"

[lib]
name = "brewi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
window-vibrancy = "0.5"
regex = "1"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
